# The website AND the API are deployed together on Netlify.
#   website  -> Next.js (Netlify's Next.js support)
#   API      -> netlify/functions-src/api.mts, bundled at build time into netlify/functions/api.mjs and served at /api/*
#               on the same address as the website (so there is no cross-site call and no CORS to configure).
# Environment variables to set in Netlify (Site configuration -> Environment variables): see docs/GO_LIVE.md.

[build]
  # install the API's own dependencies (fastify, pg, ...), bundle the API into one function file, then build the site
  command = "npm --prefix api ci && npm --prefix api run build:function && npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

# Browser hardening for every page and API answer (QA finding BUG-016: the site could be framed by any other page).
# frame-ancestors / X-Frame-Options stop clickjacking; the CSP below deliberately lists only the directives that cannot
# break a page (a full script/style CSP needs a nonce setup first, see docs/GO_LIVE.md). Netlify already sends HSTS.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
